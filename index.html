<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a36">
  <meta name="description" content="이름과 인사말을 입력해 한가위 감사 이미지를 만드세요.">
  <title>한가위 감사 이미지 만들기</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071a36'/%3E%3Ccircle cx='39' cy='24' r='14' fill='%23ffe9ad'/%3E%3Cpath d='M9 48c10-13 22-11 28-4 7-9 16-8 20 4' fill='%231d4d86'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --navy: #071a36;
      --blue: #003da6;
      --ink: #13233d;
      --muted: #68758a;
      --line: #dce3ec;
      --paper: #f4f7fb;
      --gold: #c9a45c;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(56, 99, 154, .18), transparent 34rem),
        linear-gradient(140deg, #eef3f9 0%, #f8fafc 44%, #edf2f8 100%);
    }

    button, input, textarea { font: inherit; }

    .page {
      width: min(1180px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px 0 44px;
      display: grid;
      grid-template-columns: minmax(330px, 540px) minmax(320px, 1fr);
      gap: clamp(28px, 5vw, 72px);
      align-items: center;
    }

    .preview-column { min-width: 0; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.14;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .canvas-shell {
      position: relative;
      width: min(100%, 510px);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 26px 70px rgba(15, 35, 65, .2), 0 2px 8px rgba(15, 35, 65, .12);
      background: var(--navy);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
    }

    .form-card {
      padding: clamp(24px, 4vw, 38px);
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 24px;
      background: rgba(255,255,255,.84);
      box-shadow: 0 18px 55px rgba(26, 47, 79, .11);
      backdrop-filter: blur(18px);
    }

    .form-card h2 {
      margin: 0 0 5px;
      color: var(--navy);
      font-size: 21px;
      letter-spacing: -.025em;
    }

    .form-note {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .field { margin-top: 20px; }

    .label-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    label {
      color: #26364e;
      font-size: 14px;
      font-weight: 750;
    }

    .optional, .count {
      color: #8a95a5;
      font-size: 13px;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      transition: border-color .16s, box-shadow .16s;
    }

    input { height: 50px; padding: 0 15px; }

    textarea {
      min-height: 112px;
      padding: 13px 15px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus, textarea:focus {
      border-color: #6b8fc4;
      box-shadow: 0 0 0 4px rgba(0, 61, 166, .09);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 26px;
    }

    .button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      padding: 0 21px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s, filter .15s;
    }

    .button:hover { filter: brightness(1.04); }
    .button:active { transform: translateY(1px); }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, #003da6, #0d579f);
      box-shadow: 0 9px 22px rgba(0, 61, 166, .22);
    }

    .secondary {
      color: var(--blue);
      background: #eaf1fb;
    }

    .privacy {
      margin: 14px 0 0;
      color: #8791a0;
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 5;
      max-width: calc(100% - 32px);
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 18px;
      border-radius: 999px;
      color: #fff;
      background: rgba(7, 26, 54, .94);
      box-shadow: 0 12px 32px rgba(0,0,0,.2);
      font-size: 14px;
      transition: .2s ease;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 24px, 560px);
        grid-template-columns: 1fr;
        align-items: start;
        padding-top: 22px;
        gap: 24px;
      }

      .intro { margin-bottom: 18px; }
      .canvas-shell { width: min(100%, 430px); }
      .form-card { padding: 23px 18px; border-radius: 18px; }
    }

    @media (max-width: 430px) {
      .page { width: min(100% - 20px, 410px); }
      .actions { grid-template-columns: 1fr; }
      .secondary { order: 2; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="preview-column" aria-labelledby="page-title">
      <p class="eyebrow">2026 CHUSEOK GREETING</p>
      <h1 id="page-title">한가위 감사 이미지 만들기</h1>
      <p class="intro">이름과 인사말, 하단 문구를 입력하면 카카오톡으로 보낼 수 있는 이미지가 완성됩니다.</p>
      <div class="canvas-shell">
        <canvas id="card" width="1080" height="1350" aria-label="한가위 감사 이미지 미리보기"></canvas>
      </div>
    </section>

    <section class="form-card" aria-labelledby="form-title">
      <h2 id="form-title">보내는 분 정보를 입력해 주세요</h2>
      <p class="form-note">입력 내용은 실시간으로 반영되며 서버에 저장되지 않습니다.</p>

      <div class="field">
        <div class="label-row">
          <label for="name">이름</label>
          <span class="count"><span id="nameCount">0</span>/10</span>
        </div>
        <input id="name" maxlength="10" autocomplete="name" placeholder="이름 입력">
      </div>

      <div class="field">
        <div class="label-row">
          <label for="title">직책 <span class="optional">선택</span></label>
          <span class="count"><span id="titleCount">0</span>/14</span>
        </div>
        <input id="title" maxlength="14" placeholder="예: 팀장, 대표이사">
      </div>

      <div class="field">
        <div class="label-row">
          <label for="message">감사 인사</label>
          <span class="count"><span id="messageCount">52</span>/70</span>
        </div>
        <textarea id="message" maxlength="70" rows="3">풍요로운 한가위를 맞아 감사의 마음을 전합니다.&#10;가족과 함께 행복하고 따뜻한 명절 보내시길 바랍니다.</textarea>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="footer">하단 문구 <span class="optional">선택</span></label>
          <span class="count"><span id="footerCount">0</span>/24</span>
        </div>
        <input id="footer" maxlength="24" placeholder="예: 회사명, 단체명, 모임명">
      </div>

      <div class="actions">
        <button class="button primary" id="download" type="button">JPG 이미지 저장</button>
        <button class="button secondary" id="reset" type="button">초기화</button>
      </div>
      <p class="privacy">최대 1080×1350px, 1MB 이하 JPG로 저장됩니다. 모바일에서는 공유창에서 이미지 저장 또는 카카오톡을 선택해 주세요.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const canvas = document.getElementById('card');
    const ctx = canvas.getContext('2d');
    const nameInput = document.getElementById('name');
    const titleInput = document.getElementById('title');
    const messageInput = document.getElementById('message');
    const footerInput = document.getElementById('footer');
    const toast = document.getElementById('toast');

    const defaults = {
      name: '',
      title: '',
      message: '풍요로운 한가위를 맞아 감사의 마음을 전합니다.\n가족과 함께 행복하고 따뜻한 명절 보내시길 바랍니다.',
      footer: ''
    };

    const background = new Image();
    background.src = './assets/chuseok-background.png';

    Promise.all([
      new Promise(resolve => {
        background.onload = resolve;
        background.onerror = resolve;
      }),
      document.fonts ? document.fonts.ready : Promise.resolve()
    ]).then(drawCard);

    function roundRect(x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function drawCover(image, x, y, width, height) {
      if (!image.naturalWidth) return;
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const sw = width / scale;
      const sh = height / scale;
      const sx = (image.naturalWidth - sw) / 2;
      const sy = (image.naturalHeight - sh) / 2;
      ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
    }

    function tokenizeForWrap(text) {
      return text.includes(' ') ? text.split(/\s+/) : [...text];
    }

    function wrapText(text, maxWidth) {
      const explicit = text.replace(/\r/g, '').split('\n').filter(Boolean);
      const lines = [];

      explicit.forEach(paragraph => {
        const tokens = tokenizeForWrap(paragraph.trim());
        let line = '';
        tokens.forEach(token => {
          const joiner = paragraph.includes(' ') && line ? ' ' : '';
          const test = line + joiner + token;
          if (ctx.measureText(test).width <= maxWidth || !line) {
            line = test;
          } else {
            lines.push(line);
            line = token;
          }
        });
        if (line) lines.push(line);
      });
      return lines;
    }

    function fitMessage(text, maxWidth) {
      const sizes = [49, 46, 43, 40, 37, 34, 31, 28, 25, 22];
      for (const size of sizes) {
        ctx.font = `700 ${size}px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
        const lines = wrapText(text, maxWidth);
        if (lines.length <= 2 && lines.every(line => ctx.measureText(line).width <= maxWidth)) {
          return { size, lines };
        }
      }

      const compact = text.replace(/\s+/g, ' ').trim();
      const midpoint = Math.floor(compact.length / 2);
      const spaces = [...compact].reduce((positions, char, index) => {
        if (char === ' ') positions.push(index);
        return positions;
      }, []);
      const splitAt = spaces.length
        ? spaces.reduce((best, position) => Math.abs(position - midpoint) < Math.abs(best - midpoint) ? position : best)
        : midpoint;
      const lines = [compact.slice(0, splitAt).trim(), compact.slice(splitAt).trim()].filter(Boolean);

      let size = 22;
      while (size > 14) {
        ctx.font = `700 ${size}px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
        if (lines.every(line => ctx.measureText(line).width <= maxWidth)) break;
        size -= 1;
      }
      return { size, lines };
    }

    function fitFooter(text, maxWidth) {
      let size = 30;
      while (size > 18) {
        ctx.font = `750 ${size}px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
        if (ctx.measureText(text).width <= maxWidth) break;
        size -= 1;
      }
      return size;
    }

    function drawCard() {
      const centerX = 540;
      const maxTextWidth = 900;
      const textColor = '#ffffff';
      const subTextColor = 'rgba(255, 255, 255, .94)';
      const dividerColor = 'rgba(255, 255, 255, .82)';
      const textShadow = 'rgba(4, 20, 44, .88)';

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0a2244';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawCover(background, 0, 0, canvas.width, canvas.height);

      const message = messageInput.value.trim() || defaults.message;
      const { size, lines } = fitMessage(message, maxTextWidth);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = textShadow;
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = subTextColor;
      ctx.font = '650 20px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      ctx.letterSpacing = '4px';
      ctx.fillText('마음을 담아, 감사드립니다', centerX, 503);
      ctx.letterSpacing = '0px';

      ctx.fillStyle = textColor;
      ctx.font = `700 ${size}px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
      const lineHeight = size * 1.52;
      const startY = lines.length === 1 ? 630 : 602;
      lines.forEach((line, index) => ctx.fillText(line, centerX, startY + index * lineHeight));

      const sender = [nameInput.value.trim(), titleInput.value.trim()].filter(Boolean).join(' · ');
      if (sender) {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = dividerColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 70, 745);
        ctx.lineTo(centerX + 70, 745);
        ctx.stroke();

        ctx.shadowColor = textShadow;
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 2;
        ctx.fillStyle = textColor;
        ctx.font = '650 30px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        ctx.fillText(sender, centerX, 800);
      }

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      const footer = footerInput.value.trim();
      if (footer) {
        roundRect(280, 1165, 520, 100, 22);
        ctx.fillStyle = 'rgba(255, 255, 255, .90)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, .65)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#073f86';
        ctx.font = `750 ${fitFooter(footer, 440)}px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
        ctx.fillText(footer, centerX, 1215);
      }
    }

    function updateCounts() {
      document.getElementById('nameCount').textContent = [...nameInput.value].length;
      document.getElementById('titleCount').textContent = [...titleInput.value].length;
      document.getElementById('messageCount').textContent = [...messageInput.value].length;
      document.getElementById('footerCount').textContent = [...footerInput.value].length;
    }

    function sanitizeMessage() {
      const lines = messageInput.value.replace(/\r/g, '').split('\n');
      if (lines.length > 2) {
        messageInput.value = lines.slice(0, 2).join('\n');
        showToast('감사 인사는 최대 2줄까지 입력할 수 있습니다.');
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function canvasToBlob(source, quality) {
      return new Promise(resolve => source.toBlob(resolve, 'image/jpeg', quality));
    }

    async function makeCompressedImage(maxBytes = 1024 * 1024) {
      const qualities = [.92, .86, .80, .74, .68, .60, .52, .44, .36];
      let source = canvas;
      let lastBlob = null;

      for (let scaleAttempt = 0; scaleAttempt < 4; scaleAttempt += 1) {
        for (const quality of qualities) {
          lastBlob = await canvasToBlob(source, quality);
          if (lastBlob && lastBlob.size <= maxBytes) return lastBlob;
        }

        const resized = document.createElement('canvas');
        resized.width = Math.round(source.width * .88);
        resized.height = Math.round(source.height * .88);
        const resizedContext = resized.getContext('2d');
        resizedContext.fillStyle = '#071a36';
        resizedContext.fillRect(0, 0, resized.width, resized.height);
        resizedContext.drawImage(source, 0, 0, resized.width, resized.height);
        source = resized;
      }

      return lastBlob;
    }

    [nameInput, titleInput, messageInput, footerInput].forEach(input => {
      input.addEventListener('input', () => {
        if (input === messageInput) sanitizeMessage();
        updateCounts();
        drawCard();
      });
    });

    document.getElementById('reset').addEventListener('click', () => {
      nameInput.value = defaults.name;
      titleInput.value = defaults.title;
      messageInput.value = defaults.message;
      footerInput.value = defaults.footer;
      updateCounts();
      drawCard();
      showToast('입력 내용을 초기화했습니다.');
    });

    document.getElementById('download').addEventListener('click', async () => {
      drawCard();
      const safeName = (nameInput.value.trim() || '한가위').replace(/[\\/:*?"<>|]/g, '');
      const filename = `2026_한가위_감사인사_${safeName}.jpg`;

      try {
        const blob = await makeCompressedImage();
        if (!blob || blob.size > 1024 * 1024) throw new Error('JPG 압축 실패');

        const file = new File([blob], filename, { type: 'image/jpeg' });
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isMobile && navigator.share && navigator.canShare?.({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            showToast('이미지 공유창을 열었습니다.');
          } catch (error) {
            if (error.name !== 'AbortError') throw error;
          }
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        showToast(`이미지를 저장했습니다. (${Math.ceil(blob.size / 1024)}KB)`);
      } catch (error) {
        showToast('이미지를 만들지 못했습니다. Safari 또는 Chrome에서 다시 시도해 주세요.');
      }
    });

    updateCounts();
    drawCard();
  </script>
</body>
</html>
